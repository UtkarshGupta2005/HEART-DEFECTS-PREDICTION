<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .low {
            background-color: #c6f6d5;
            color: #22543d;
        }

        .high {
            background-color: #fed7d7;
            color: #742a2a;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>💓 Heart Disease Predictor</h2>

    <form action="/predict" method="post">

        <div class="form-group">
            <label>Sex</label>
            <select name="Sex">
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="Age" required>
        </div>

        <div class="form-group">
            <label>Cigarettes per Day</label>
            <input type="number" name="Cigs">
        </div>

        <div class="form-group">
            <label>BP Medication</label>
            <select name="BPMeds">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Stroke History</label>
            <select name="Stroke">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Hypertension</label>
            <select name="Hyp">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Diabetes</label>
            <select name="Diabetes">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Total Cholesterol</label>
            <input type="number" name="Chol" required>
        </div>

        <div class="form-group">
            <label>Systolic BP</label>
            <input type="number" name="SysBP" required>
        </div>

        <div class="form-group">
            <label>Diastolic BP</label>
            <input type="number" name="DiaBP" required>
        </div>

        <div class="form-group">
            <label>BMI</label>
            <input type="number" step="0.1" name="BMI" required>
        </div>

        <div class="form-group">
            <label>Heart Rate</label>
            <input type="number" name="HR" required>
        </div>

        <div class="form-group">
            <label>Glucose</label>
            <input type="number" name="Glucose" required>
        </div>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
        <div class="result {% if 'High' in prediction %}high{% else %}low{% endif %}">
            {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
